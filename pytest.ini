[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.MovedIn20Warning
markers =
    security: authentication, authorisation and tamper-resistance behaviour
    contract: guards the HTTP contract the browser frontend depends on
    known_bug: documents a defect that is expected to fail until it is fixed
